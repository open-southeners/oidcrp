name: Release

# Pushing a vX.Y.Z (or vX.Y.Z-rc.N) tag first runs the full CI (ci.yml) on the
# tagged commit; nothing is published unless it passes. `release` then creates
# the GitHub release with the matching CHANGELOG.md section as its notes (tags
# with a suffix are marked pre-release) and asks the Go module proxy to fetch
# the new version, so it is installable and listed on pkg.go.dev right away.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Create GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Extract CHANGELOG notes
        id: changelog
        uses: release-flow/keep-a-changelog-action@74931dec7ecdbfc8e38ac9ae7e8dd84c08db2f32 # v3.0.0
        with:
          command: query
          version: ${{ steps.version.outputs.version }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ${{ steps.changelog.outputs.release-notes }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
      - name: Warm the Go module proxy
        env:
          MODULE: github.com/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          for attempt in 1 2 3; do
            if curl -fsS "https://proxy.golang.org/${MODULE}/@v/${TAG}.info"; then
              exit 0
            fi
            sleep 15
          done
          echo "::warning::proxy.golang.org did not return ${MODULE}@${TAG} yet; it will be fetched on first use."
